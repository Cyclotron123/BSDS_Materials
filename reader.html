<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF Reader</title>
  <meta name="description" content="Custom in-browser PDF reader for BSDS Materials." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/reader.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="assets/js/reader.js" defer></script>
</head>
<body>
  <div class="reader-app">
    <header class="toolbar" role="toolbar" aria-label="PDF reader controls">
      <div class="toolbar-group">
        <button id="backBtn" class="tool-btn" title="Back to library" aria-label="Back to library">←</button>
        <div class="doc-title" id="docTitle">Loading…</div>
      </div>

      <div class="toolbar-group center">
        <button id="prevPage" class="tool-btn" title="Previous page" aria-label="Previous page">▲</button>
        <div class="page-jump">
          <input id="pageInput" type="number" min="1" value="1" aria-label="Page number" />
          <span id="pageTotal" class="muted">/ 0</span>
        </div>
        <button id="nextPage" class="tool-btn" title="Next page" aria-label="Next page">▼</button>

        <span class="divider"></span>

        <button id="zoomOut" class="tool-btn" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button id="zoomIn" class="tool-btn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="fitWidth" class="tool-btn wide" title="Fit to width" aria-label="Fit to width">Fit width</button>
        <button id="fitPage" class="tool-btn wide" title="Fit to page" aria-label="Fit to page">Fit page</button>
      </div>

      <div class="toolbar-group right">
        <label class="search-box" title="Search in document">
          <input id="searchInput" type="search" placeholder="Search in PDF" aria-label="Search in PDF" />
        </label>
        <button id="searchPrev" class="tool-btn" title="Previous search match" aria-label="Previous search match">‹</button>
        <button id="searchNext" class="tool-btn" title="Next search match" aria-label="Next search match">›</button>
        <button id="themeToggle" class="tool-btn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
        <button id="fullscreenBtn" class="tool-btn" title="Fullscreen" aria-label="Fullscreen">⤢</button>
        <button id="downloadBtn" class="tool-btn" title="Download PDF" aria-label="Download PDF">↓</button>
        <button id="printBtn" class="tool-btn" title="Print PDF" aria-label="Print PDF">⎙</button>
      </div>
    </header>

    <div id="statusBar" class="status-bar">Preparing reader…</div>

    <main id="viewerWrap" class="viewer-wrap">
      <section id="viewer" class="viewer" aria-label="PDF pages"></section>
    </main>
  </div>
</body>
</html>
